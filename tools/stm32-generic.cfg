# Generic STM32 attach for identification: any Cortex-M behind an ST-LINK,
# no family specific events (no clock setup, no DBGMCU writes, no flash bank).
# The probe is selected by the caller (-c "adapter serial <SN>") before this file.
source [find target/swj-dp.tcl]

set _CHIPNAME stm32
set _TARGETNAME $_CHIPNAME.cpu

# -expected-id 0 accepts any DP/TAP id (family is unknown at this point)
swj_newdap $_CHIPNAME cpu -expected-id 0
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian little -dap $_CHIPNAME.dap

# Memory reads for the probe script. mdw/mdh are used instead of read_memory:
# with ST-LINK HLA (OpenOCD 0.12) read_memory was seen returning values of other
# addresses. Note: HLA does not report bus faults, an unmapped address returns
# stale data - callers must validate values (see stm32_probe.py).
proc rd32 {addr} {
  if {[catch {set out [capture "mdw $addr"]} err]} {
    echo [format "RD32 0x%08x ERR" $addr]
  } else {
    echo "RD32 [string trim $out]"
  }
}
proc rd16 {addr} {
  if {[catch {set out [capture "mdh $addr"]} err]} {
    echo [format "RD16 0x%08x ERR" $addr]
  } else {
    echo "RD16 [string trim $out]"
  }
}

# Halt for reliable reads, and restore the previous run state afterwards
proc probe_begin {} {
  global _probe_was_running
  set st [stm32.cpu curstate]
  echo "PROBE_STATE $st"
  set _probe_was_running [expr {$st eq "running"}]
  if {$_probe_was_running} {
    if {[catch {halt 1000} err]} { echo "PROBE_HALT_FAILED $err" }
  }
}
proc probe_end {} {
  global _probe_was_running
  if {[info exists _probe_was_running] && $_probe_was_running} { resume }
}
