name: Build

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Firmware (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        preset: [debug, release, debug-180mhz]
    steps:
      - uses: actions/checkout@v4

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Upload firmware
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/*.elf
            build/${{ matrix.preset }}/*.hex
            build/${{ matrix.preset }}/*.bin
            build/${{ matrix.preset }}/*.map

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset host-tests

      - name: Build
        run: cmake --build --preset host-tests

      - name: Test
        run: ctest --preset host-tests
